name: Compilar APK Astharot

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'astharot-mobile/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astharot-mobile
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: npm install

      - name: Instalar Pillow
        run: python -m pip install pillow

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Aplicar icono personalizado
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          base = Path('.')
          src = base / 'resources' / 'icon-1024.png'
          if not src.exists():
              raise SystemExit('No existe resources/icon-1024.png')
          img = Image.open(src).convert('RGBA')
          android_res = base / 'android' / 'app' / 'src' / 'main' / 'res'
          # Eliminar adaptive icons XML para forzar el uso del PNG clásico
          anydpi = android_res / 'mipmap-anydpi-v26'
          if anydpi.exists():
              for child in anydpi.iterdir():
                  child.unlink()
          sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192,
          }
          for folder, size in sizes.items():
              dest = android_res / folder
              dest.mkdir(parents=True, exist_ok=True)
              resized = img.resize((size, size), Image.LANCZOS)
              resized.save(dest / 'ic_launcher.png')
              resized.save(dest / 'ic_launcher_round.png')
          print('Iconos Android generados correctamente.')
          PY

      - name: Configurar pantalla completa y horizontal
        run: |
          python - <<'PY'
          from pathlib import Path

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')
          marker = 'android:theme="@style/AppTheme.NoActionBarLaunch"'
          attrs = marker + '\n            android:screenOrientation="landscape"' + \
                  '\n            android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode"'
          if 'android:screenOrientation=' not in text:
              text = text.replace(marker, attrs)
          manifest.write_text(text, encoding='utf-8')

          main = Path('android/app/src/main/java/com/arcadiacorps/astharotrpg/MainActivity.java')
          main.parent.mkdir(parents=True, exist_ok=True)
          main.write_text('''package com.arcadiacorps.astharotrpg;

import android.os.Bundle;
import android.view.View;
import android.view.Window;
import android.view.WindowInsets;
import android.view.WindowInsetsController;
import com.getcapacitor.BridgeActivity;

public class MainActivity extends BridgeActivity {
    private void immersive() {
        Window window = getWindow();
        if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.R) {
            WindowInsetsController controller = window.getInsetsController();
            if (controller != null) {
                controller.hide(WindowInsets.Type.statusBars() | WindowInsets.Type.navigationBars());
                controller.setSystemBarsBehavior(
                    WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                );
            }
        } else {
            window.getDecorView().setSystemUiVisibility(
                View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY |
                View.SYSTEM_UI_FLAG_FULLSCREEN |
                View.SYSTEM_UI_FLAG_HIDE_NAVIGATION |
                View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN |
                View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION |
                View.SYSTEM_UI_FLAG_LAYOUT_STABLE
            );
        }
    }

    @Override
    public void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);
        immersive();
    }

    @Override
    public void onWindowFocusChanged(boolean hasFocus) {
        super.onWindowFocusChanged(hasFocus);
        if (hasFocus) immersive();
    }
}
''', encoding='utf-8')
          PY

      - name: Sincronizar recursos
        run: npx cap sync android

      - name: Compilar APK debug
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Astharot-RPG-debug
          path: astharot-mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
