<section id="estado" class="reveal">
  <div class="wrap">
    <div class="stats-grid">
      <div class="stat-card" style="--acc:var(--green)">
        <span class="stat-icon">🟢</span>
        <span class="stat-num" id="statUptime">99.9%</span>
        <span class="stat-label">Uptime del bot</span>
      </div>
      <div class="stat-card" style="--acc:var(--gold)">
        <span class="stat-icon">👥</span>
        <span class="stat-num gold" id="statUsers">0</span>
        <span class="stat-label">Usuarios registrados</span>
      </div>
      <div class="stat-card" style="--acc:var(--violet)">
        <span class="stat-icon">⌨️</span>
        <span class="stat-num violet" id="statCommands">0</span>
        <span class="stat-label">Comandos disponibles</span>
      </div>
      <div class="stat-card" style="--acc:var(--red)">
        <span class="stat-icon">⚔️</span>
        <span class="stat-num" id="statCategories">0</span>
        <span class="stat-label">Categorías de comandos</span>
      </div>
      <div class="stat-card" style="--acc:var(--gold)">
        <span class="stat-icon">👁️</span>
        <span class="stat-num" id="statVisits">—</span>
        <span class="stat-label">Visitas totales</span>
      </div>
    </div>
  </div>
</section>
