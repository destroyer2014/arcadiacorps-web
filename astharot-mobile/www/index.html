<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,height=device-height,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#090608"><title>Astharot RPG</title><link rel="stylesheet" href="assets/astharot-mobile.css?v=9"></head><body>
<div id="studioIntro" class="studio-intro">
  <img src="assets/art/intro-arcadiacorp.png" alt="ArcadiaCorp presenta">
  <audio id="studioAudio" preload="auto" src="assets/audio/intro-arcadiacorp.wav"></audio>
  <button id="skipIntro" type="button">Saltar</button>
</div>
<div id="app">
<section id="loading" class="full loading" hidden><div class="boot-version">Astharot v9</div><img class="loading-art" src="assets/art/loading-v7.png" alt="Astharot RPG"><div class="loading-shade"></div><div class="loadbar"><i id="loadFill"></i></div><p id="loadText">Cargando aventura...</p></section>
<section id="login" class="full login" hidden><div class="boot-version">Astharot v9</div>
  <form id="loginForm" class="login-box">
    <h1 class="sr-only">Astharot RPG</h1>
    <input id="email" type="email" placeholder="Correo" autocomplete="email" required>
    <div class="pw"><input id="password" type="password" placeholder="Contraseña" autocomplete="current-password" required><button id="eye" type="button">◉</button></div>
    <button id="loginBtn" class="gold-btn" type="submit">INICIAR SESIÓN</button>
    <a class="dark-btn" href="https://arcadiacorps.online/registro.html" target="_blank">CREAR CUENTA</a>
    <button id="guestBtn" class="dark-btn" type="button">INVITADO</button>
    <p id="loginStatus"></p>
  </form>
</section>
<section id="creator" class="full creator" hidden>
  <div class="creator-panel"><div class="version-badge">Astharot v9</div><h2>Seleccionar clase</h2><input id="heroName" maxlength="18" placeholder="Nombre del héroe"><div class="class-grid">
  <button data-class="warrior"><img src="assets/art/warrior-card.png"><b>Guerrero</b></button>
  <button data-class="mage"><img src="assets/art/mage-card.png"><b>Mago</b></button>
  <button data-class="assassin"><img src="assets/art/assassin-card.png"><b>Asesina</b></button></div><button id="createHero" class="gold-btn" disabled>COMENZAR</button><p id="creatorStatus"></p></div>
</section>
<section id="game" class="game" hidden>
  <div id="map" class="map village"><canvas id="fx"></canvas><div id="hero" class="hero"><div id="heroSprite" class="hero-sprite"></div><span id="heroNameTag">Zemo</span></div><button id="portal" class="portal-hit" aria-label="Entrar al portal"></button></div>
  <header class="hud"><div class="profile"><div id="portrait">⚔️</div><div><b id="heroNameHud">Zemo</b><small>Nv. <span id="level">1</span></small></div></div><div class="bars"><div class="hp"><i id="hp"></i><span id="hpText"></span></div><div class="mp"><i id="mp"></i><span id="mpText"></span></div></div><div class="currencies">🪙 <b id="gold">0</b>　💎 <b id="gems">0</b></div></header>
  <aside id="questHint" class="quest"><small>Misiones</small><b id="questTitle">Misión: Habla con Eldric</b><span id="questDesc">Acércate al sabio de la aldea.</span></aside>
  <div class="top-actions"><button data-open="mail">✉<small>Buzón</small></button><button data-open="settings">☰<small>Menú</small></button></div>
  <div class="side-actions"><button data-open="inventory">🎒<small>Mochila</small></button><button data-open="quests">📜<small>Diario</small></button><button data-open="mail">🔔<small>Noticias</small></button></div>
  <div id="joystick" class="joystick"><i id="stick"></i></div>
  <div class="skills"><button id="potion">🧪<small id="potions">2</small></button><button id="skill1">🔥</button><button id="skill2">⚡</button><button id="attack" class="attack">⚔️<small>Atacar</small></button></div>
  <nav class="bottom"><button data-open="character">🛡<small>Personaje</small></button><button data-open="inventory">🎒<small>Inventario</small></button><button class="active">🗺<small>Mapa</small></button><button data-open="quests">📜<small>Misiones</small></button><button data-open="settings">⚙<small>Ajustes</small></button></nav>
  <div id="toast" class="toast" hidden></div>
</section>
<dialog id="panel"><button id="panelClose" class="x">×</button><div id="panelBody"></div></dialog>
</div><script src="assets/astharot-mobile.js?v=9"></script></body></html>
