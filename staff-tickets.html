<!DOCTYPE html><html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel de soporte — ArcadiaCorps</title><meta name="theme-color" content="#0d0a12">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css?v=tickets-v1"></head><body>
<div id="site-header"></div>
<main class="ticket-shell staff-ticket-shell"><div class="wrap">
<header class="ticket-page-head"><div><span class="eyebrow">Área del equipo</span><h1>Bandeja de soporte</h1><p>Atiende solicitudes, asigna responsables y cambia su estado.</p></div><a href="owner-panel.html" class="ticket-secondary-btn" data-owner-only hidden>Panel Owner</a></header>
<div class="ticket-auth-note" id="staffAccessMessage">Comprobando permisos...</div>
<section class="staff-ticket-dashboard" id="staffDashboard" hidden>
  <aside class="staff-ticket-sidebar">
    <div class="staff-stats" id="staffStats"></div>
    <label class="staff-search">⌕ <input type="search" id="staffSearch" placeholder="Buscar ticket..."></label>
    <div class="ticket-filter-row vertical" id="staffFilters">
      <button type="button" class="active" data-staff-filter="all">Todos</button><button type="button" data-staff-filter="abierto">Nuevos</button><button type="button" data-staff-filter="en_proceso">En proceso</button><button type="button" data-staff-filter="esperando_usuario">Esperando usuario</button><button type="button" data-staff-filter="resuelto">Resueltos</button>
    </div>
  </aside>
  <section class="staff-ticket-list-panel"><div class="ticket-panel-head"><div><span>Tickets</span><strong id="staffTicketCount">0 resultados</strong></div><button type="button" id="staffRefresh">↻</button></div><div id="staffTicketList" class="ticket-list staff-list"></div></section>
  <section class="ticket-conversation-panel" id="staffConversation"><div class="ticket-empty-state"><span>🛡️</span><h2>Selecciona un ticket</h2><p>Podrás responder, asignarlo y cambiar su estado.</p></div></section>
</section></div></main>
<div id="site-footer"></div><script src="assets/include.js?v=tickets-v1"></script><script src="assets/tickets-staff.js?v=tickets-v1" defer></script>
</body></html>
