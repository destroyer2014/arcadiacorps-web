<!DOCTYPE html><html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel Owner — ArcadiaCorps</title><meta name="theme-color" content="#0d0a12">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css?v=tickets-v1"></head><body>
<div id="site-header"></div>
<main class="ticket-shell owner-shell"><div class="wrap">
<header class="ticket-page-head"><div><span class="eyebrow">Control total</span><h1>Panel Owner</h1><p>Administra el equipo, publica notificaciones y supervisa el soporte.</p></div><a href="staff-tickets.html" class="ticket-secondary-btn">Abrir soporte</a></header>
<div class="ticket-auth-note" id="ownerAccessMessage">Comprobando permisos...</div>
<section id="ownerDashboard" hidden>
  <div class="owner-summary-grid" id="ownerSummary"></div>
  <div class="owner-grid">
    <section class="owner-card"><div class="owner-card-head"><div><span>Usuarios y roles</span><h2>Equipo</h2></div><button type="button" id="ownerRefreshUsers">↻</button></div><label class="staff-search">⌕ <input type="search" id="ownerUserSearch" placeholder="Buscar correo o usuario"></label><div class="owner-user-list" id="ownerUserList"></div></section>
    <section class="owner-card"><div class="owner-card-head"><div><span>Centro de avisos</span><h2>Nueva notificación</h2></div></div>
      <form id="ownerNotificationForm" class="owner-notification-form">
        <label>Título<input id="ownerNotifTitle" required maxlength="120" placeholder="Ej: Mantenimiento programado"></label>
        <label>Mensaje<textarea id="ownerNotifMessage" required maxlength="2000" rows="5" placeholder="Escribe el aviso..."></textarea></label>
        <div class="ticket-form-grid"><label>Destino<select id="ownerNotifScope"><option value="all">Todos los usuarios</option><option value="role">Por rol</option><option value="user">Usuario específico</option></select></label><label id="ownerRoleTargetWrap" hidden>Rol<select id="ownerNotifRole"><option value="user">Usuarios</option><option value="staff">Staff</option><option value="owner">Owner</option></select></label></div>
        <label id="ownerUserTargetWrap" hidden>Usuario<select id="ownerNotifUser"></select></label>
        <div class="ticket-form-grid"><label>Texto del botón<input id="ownerNotifActionLabel" maxlength="40" placeholder="Ver más"></label><label>Enlace<input id="ownerNotifActionUrl" maxlength="300" placeholder="soporte.html"></label></div>
        <div class="ticket-form-status" id="ownerNotifStatus"></div><button type="submit" class="ticket-primary-btn">Publicar notificación</button>
      </form>
    </section>
  </div>
</section></div></main>
<div id="site-footer"></div><script src="assets/include.js?v=tickets-v1"></script><script src="assets/owner-panel.js?v=tickets-v1" defer></script>
</body></html>
