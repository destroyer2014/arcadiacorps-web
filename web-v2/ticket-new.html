<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nuevo ticket — ArcadiaCorps</title><link rel="stylesheet" href="assets/styles.css?v=23"></head><body><main class="dashboard app-page ticket-page"><a class="back-link ticket-back ticket-back-standalone" href="dashboard.html">← Volver al panel</a><div class="page-heading ticket-heading"><div><span class="eyebrow">Soporte</span><h1>Abrir ticket</h1><p>Describe el problema y adjunta imágenes si ayudan a explicarlo.</p></div></div><form id="form" class="panel ticket-form"><div class="field"><label>Asunto</label><input id="subject" maxlength="140" required></div><div class="row"><div class="field"><label>Categoría</label><select id="category"><option>Cuenta</option><option>Compra</option><option>Premium</option><option>Subbot</option><option>Error técnico</option><option>Otro</option></select></div><div class="field"><label>Prioridad</label><select id="priority"><option value="normal">Normal</option><option value="low">Baja</option><option value="high">Alta</option><option value="urgent">Urgente</option></select></div></div><div class="field"><label>Descripción</label><textarea id="body" required maxlength="5000"></textarea></div><div class="image-picker"><strong>Imágenes opcionales</strong><small class="hint">JPG, PNG, WEBP o GIF. Máximo 5 MB por imagen.</small><input id="images" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple><div id="previews" class="image-previews"></div></div><div id="msg" class="message"></div><button class="primary" type="submit">Crear ticket</button></form></main><script type="module">
import { supabase } from './assets/auth.js';
import { mountShell } from './assets/shell.js';
import { getCurrentAccess } from './assets/access.js';
import { uploadTicketImages, insertTicketMessage } from './assets/tickets.js';

const access = await getCurrentAccess();
if (!access) location.replace('login.html');
await mountShell();

const form = document.querySelector('#form');
const subjectInput = document.querySelector('#subject');
const categoryInput = document.querySelector('#category');
const priorityInput = document.querySelector('#priority');
const descriptionInput = document.querySelector('#body');
const imageInput = document.querySelector('#images');
const previews = document.querySelector('#previews');
const message = document.querySelector('#msg');
let files = [];

function show(text, isError = false) {
  message.textContent = text;
  message.className = `message show ${isError ? 'error' : 'ok'}`;
  message.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function renderPreviews() {
  previews.innerHTML = '';
  files.forEach((file, index) => {
    const card = document.createElement('div');
    card.className = 'image-preview';
    const img = document.createElement('img');
    img.src = URL.createObjectURL(file);
    img.alt = file.name;
    const remove = document.createElement('button');
    remove.type = 'button';
    remove.textContent = '×';
    remove.addEventListener('click', () => {
      files.splice(index, 1);
      renderPreviews();
    });
    card.append(img, remove);
    previews.append(card);
  });
}

imageInput.addEventListener('change', () => {
  files = [...imageInput.files];
  renderPreviews();
});

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  const button = form.querySelector('button[type="submit"]');
  button.disabled = true;
  button.textContent = 'Enviando…';
  message.className = 'message';

  try {
    const description = descriptionInput.value.trim();
    const payload = {
      user_id: access.user.id,
      subject: subjectInput.value.trim(),
      category: categoryInput.value,
      priority: priorityInput.value,
      description
    };

    if (payload.subject.length < 3) throw new Error('El asunto debe tener al menos 3 caracteres.');
    if (!description) throw new Error('Escribe una descripción para el ticket.');

    const { data: ticket, error: ticketError } = await supabase
      .from('tickets')
      .insert(payload)
      .select('id,ticket_number,user_id,subject,description,category,priority,status,created_at,updated_at')
      .single();

    if (ticketError) throw ticketError;
    if (!ticket?.id) throw new Error('El servidor no devolvió el identificador del ticket.');

    let paths = [];
    if (files.length) {
      try {
        paths = await uploadTicketImages(files, access.user.id, ticket.id);
      } catch (uploadError) {
        console.error('Falló la carga de imágenes:', uploadError);
      }
    }

    // Algunas instalaciones antiguas crean automáticamente el primer mensaje
    // desde un trigger. Reutilizamos ese registro para no duplicar la descripción.
    const { data: initialMessages, error: initialLookupError } = await supabase
      .from('ticket_messages')
      .select('*')
      .eq('ticket_id', ticket.id)
      .order('created_at', { ascending: true })
      .limit(5);
    if (initialLookupError) throw initialLookupError;

    const existingInitial = (initialMessages || []).find((row) =>
      String(row.author_id || row.sender_id || '') === String(access.user.id) &&
      String(row.body || row.message || '').trim() === description
    );

    if (existingInitial) {
      if (paths.length) {
        const { error: attachmentError } = await supabase
          .from('ticket_messages')
          .update({ attachments: paths })
          .eq('id', existingInitial.id);
        if (attachmentError) throw attachmentError;
      }
    } else {
      const { error: messageError } = await insertTicketMessage({
        ticket,
        authorId: access.user.id,
        body: description,
        attachments: paths
      });
      if (messageError) throw messageError;
    }

    const { data: verified, error: verifyError } = await supabase
      .from('tickets')
      .select('id,ticket_number')
      .eq('id', ticket.id)
      .eq('user_id', access.user.id)
      .maybeSingle();

    if (verifyError) throw verifyError;
    if (!verified) throw new Error('El ticket se creó, pero no pudo verificarse en tu cuenta.');

    sessionStorage.setItem('arcadia_ticket_created', JSON.stringify({
      id: ticket.id,
      number: ticket.ticket_number || ''
    }));

    show(`✓ Ticket ${ticket.ticket_number || ''} enviado correctamente.`);
    button.textContent = 'Ticket enviado';
    setTimeout(() => location.replace(`tickets.html?created=1&id=${encodeURIComponent(ticket.id)}`), 2200);
  } catch (error) {
    console.error(error);
    show(error?.message || 'No se pudo crear el ticket.', true);
    button.disabled = false;
    button.textContent = 'Crear ticket';
  }
});
</script></body></html>
