<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nuevo ticket — ArcadiaCorps</title><link rel="stylesheet" href="assets/styles.css?v=15"></head><body><main class="dashboard app-page ticket-page"><div class="page-heading"><div><span class="eyebrow">Soporte</span><h1>Abrir ticket</h1><p>Describe el problema y adjunta imágenes si ayudan a explicarlo.</p></div></div><form id="form" class="panel ticket-form"><div class="field"><label>Asunto</label><input id="subject" maxlength="140" required></div><div class="row"><div class="field"><label>Categoría</label><select id="category"><option>Cuenta</option><option>Compra</option><option>Premium</option><option>Subbot</option><option>Error técnico</option><option>Otro</option></select></div><div class="field"><label>Prioridad</label><select id="priority"><option value="normal">Normal</option><option value="low">Baja</option><option value="high">Alta</option><option value="urgent">Urgente</option></select></div></div><div class="field"><label>Descripción</label><textarea id="body" required maxlength="5000"></textarea></div><div class="image-picker"><strong>Imágenes opcionales</strong><small class="hint">JPG, PNG, WEBP o GIF. Máximo 5 MB por imagen.</small><input id="images" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple><div id="previews" class="image-previews"></div></div><div id="msg" class="message"></div><button class="primary" type="submit">Crear ticket</button></form></main><script type="module">
import {supabase} from './assets/auth.js';import {mountShell} from './assets/shell.js';import {getCurrentAccess} from './assets/access.js';import {uploadTicketImages,esc} from './assets/tickets.js';const access=await getCurrentAccess();if(!access)throw Error('Sin sesión');await mountShell();const input=document.querySelector('#images'),prev=document.querySelector('#previews'),msg=document.querySelector('#msg');let files=[];const show=(t,e=false)=>{msg.textContent=t;msg.className=`message show ${e?'error':'ok'}`};function render(){prev.innerHTML=files.map((f,i)=>`<div class="image-preview"><img src="${URL.createObjectURL(f)}"><button type="button" data-i="${i}">×</button></div>`).join('');prev.querySelectorAll('button').forEach(b=>b.onclick=()=>{files.splice(+b.dataset.i,1);render()})}input.onchange=()=>{files=[...input.files];render()};document.querySelector('#form').onsubmit=async e=>{e.preventDefault();const btn=e.submitter;btn.disabled=true;try{const{data:t,error}=await supabase.from('tickets').insert({user_id:access.user.id,subject:subject.value.trim(),category:category.value,priority:priority.value}).select().single();if(error)throw error;const paths=await uploadTicketImages(files,access.user.id,t.id);const{error:me}=await supabase.from('ticket_messages').insert({ticket_id:t.id,author_id:access.user.id,body:body.value.trim(),attachments:paths});if(me)throw me;location.replace(`ticket-detail.html?id=${t.id}`)}catch(err){show(esc(err.message),true);btn.disabled=false}};</script></body></html>
