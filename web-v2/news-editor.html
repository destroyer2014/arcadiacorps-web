<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Editor de noticias — ArcadiaCorps</title><link rel="stylesheet" href="assets/styles.css?v=14">
  <link rel="stylesheet" href="assets/theme-v33.css?v=34">
  <script defer src="assets/effects-v33.js?v=36.2"></script>
  <link rel="stylesheet" href="assets/theme-v35.css?v=35">
  <link rel="stylesheet" href="assets/ai-support-v35.css?v=35">
  <script type="module" src="assets/ai-support-v35.js?v=35"></script>
  <link rel="stylesheet" href="assets/theme-v36.css?v=36">
  <link rel="stylesheet" href="assets/presence-v36.css?v=36">
  <link rel="stylesheet" href="assets/notifications-v36.css?v=36">
  <script type="module" src="assets/presence-v36.js?v=36.2"></script>
  <script type="module" src="assets/notifications-v36.js?v=36"></script>
  <link rel="stylesheet" href="assets/performance-v36-2.css?v=36.2">
</head><body>
<main class="dashboard app-page editor-page"><div class="page-heading"><div><span class="eyebrow">Owner y Staff</span><h1 id="editorTitle">Nueva publicación</h1><p>Publica novedades reales para la comunidad.</p></div><a class="btn secondary compact" href="news.html">Cancelar</a></div><form id="newsForm" class="panel editor-form"><div class="field"><label for="title">Título</label><input id="title" maxlength="160" required></div><div class="field"><label for="excerpt">Resumen</label><textarea id="excerpt" maxlength="320" placeholder="Descripción breve para el listado"></textarea></div><div class="field"><label for="content">Contenido</label><textarea id="content" class="content-editor" required placeholder="Escribe la noticia completa…"></textarea></div><div class="field"><label for="externalUrl">Enlace externo opcional</label><input id="externalUrl" type="url" placeholder="https://..."></div><div class="upload-news"><img id="coverPreview" hidden alt="Vista previa"><div><strong>Imagen destacada</strong><small>JPG, PNG, WEBP o GIF · máximo 5 MB</small><input id="coverFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></div></div><label class="toggle-row"><input id="isPinned" type="checkbox"><span>Fijar esta publicación</span></label><label class="field"><span>Estado</span><select id="status"><option value="published">Publicada</option><option value="draft">Borrador</option></select></label><div id="editorMessage" class="message"></div><div class="form-actions"><button class="primary" type="submit">Guardar publicación</button><button id="deletePost" class="danger-btn" type="button" hidden>Eliminar</button></div></form></main>
<script type="module">
import { mountShell } from './assets/shell.js?v=36';import { requireRole } from './assets/access.js';import { getNewsPost,saveNewsPost,uploadNewsCover,deleteNewsPost } from './assets/news.js';
const access=await requireRole(['owner','staff']);if(!access)throw new Error('Sin permiso');await mountShell();const id=new URLSearchParams(location.search).get('id');let existing=null;let coverUrl='';const msg=document.querySelector('#editorMessage');const show=(t,e=false)=>{msg.textContent=t;msg.className=`message show ${e?'error':'ok'}`};
if(id){existing=await getNewsPost(id);if(!existing)throw new Error('Publicación no encontrada');document.querySelector('#editorTitle').textContent='Editar publicación';for(const [k,v] of Object.entries({title:existing.title,excerpt:existing.excerpt||'',content:existing.content,externalUrl:existing.external_url||''}))document.querySelector(`#${k}`).value=v;document.querySelector('#isPinned').checked=existing.is_pinned;document.querySelector('#status').value=existing.status;coverUrl=existing.cover_url||'';if(coverUrl){const p=document.querySelector('#coverPreview');p.src=coverUrl;p.hidden=false}document.querySelector('#deletePost').hidden=false}
document.querySelector('#coverFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const p=document.querySelector('#coverPreview');p.src=URL.createObjectURL(f);p.hidden=false};
document.querySelector('#newsForm').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;b.textContent='Guardando…';try{const f=document.querySelector('#coverFile').files[0];if(f)coverUrl=await uploadNewsCover(f,access.user.id);const saved=await saveNewsPost({title:document.querySelector('#title').value,excerpt:document.querySelector('#excerpt').value,content:document.querySelector('#content').value,external_url:document.querySelector('#externalUrl').value.trim()||null,cover_url:coverUrl,is_pinned:document.querySelector('#isPinned').checked,status:document.querySelector('#status').value},id);location.replace(`news-detail.html?slug=${encodeURIComponent(saved.slug)}`)}catch(err){show(err.message,true);b.disabled=false;b.textContent='Guardar publicación'}};
document.querySelector('#deletePost').onclick=async()=>{if(!confirm('Esta acción eliminará la noticia y sus comentarios. ¿Continuar?'))return;try{await deleteNewsPost(id);location.replace('news.html')}catch(e){show(e.message,true)}};
</script></body></html>
