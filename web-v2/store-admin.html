" checked> Activa</label></div><button class="btn primary" type="submit">Guardar oferta</button></form></section><section class="panel admin-store-panel"><div class="store-section-head"><div><span class="eyebrow">Ventas</span><h2>Pedidos recientes</h2></div><button class="btn secondary admin-refresh" id="refreshOrders" type="button">Actualizar</button></div><div id="adminOrders" class="admin-orders"><div class="empty-state">Cargando…</div></div></section></main><script type="module" src="assets/store-admin.js?v=26"></script></body></html>
