<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mis compras — ArcadiaCorps</title><link rel="stylesheet" href="assets/styles.css?v=15"></head><body><main class="dashboard app-page purchases-page"><div class="page-heading"><div><span class="eyebrow">Cuenta</span><h1>Historial de compras</h1><p>Compras registradas en tu cuenta.</p></div></div><section id="list" class="purchase-list"><div class="panel empty-state">Cargando…</div></section></main><script type="module">import{mountShell}from'./assets/shell.js';import{getCurrentAccess}from'./assets/access.js';import{supabase}from'./assets/auth.js';import{esc,fmt}from'./assets/tickets.js';const a=await getCurrentAccess();if(!a)throw Error('Sin sesión');await mountShell();const{data,error}=await supabase.from('purchases').select('*').order('purchased_at',{ascending:false});if(error)list.innerHTML=`<div class="message show error">${esc(error.message)}</div>`;else list.innerHTML=data?.length?data.map(p=>`<article class="purchase-card"><div><span class="ticket-number">${esc(p.order_number)}</span><h3>${esc(p.product_name)}</h3><p>${fmt(p.purchased_at)}</p><p class="purchase-status">${esc(p.status)}</p></div><div class="purchase-price">${esc(p.currency)} ${Number(p.amount).toFixed(2)}</div></article>`).join(''):'<div class="panel empty-state">Todavía no tienes compras registradas.</div>';</script></body></html>
