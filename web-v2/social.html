<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Social — ArcadiaCorps</title><link rel="stylesheet" href="assets/styles.css?v=27"></head><body><main class="dashboard social-page">
<section class="social-stories panel"><div class="story-strip" id="storyStrip"><button class="story-create" id="openStory" type="button"><span>＋</span><small>Tu historia</small></button></div></section>
<section class="featured-panel panel"><header><h2>⭐ Destacadas</h2><button id="refreshSocial" class="icon-button" type="button" aria-label="Actualizar">↻</button></header><div id="featuredPosts" class="featured-list"><p class="social-empty">No hay publicaciones destacadas aún</p></div></section>
<section class="quick-post panel"><div id="quickAvatar" class="social-avatar fallback">U</div><button id="openComposer" type="button">Comparte algo con la comunidad…</button><button id="quickSend" class="quick-send" type="button">➤</button></section>
<div id="socialMessage" class="message"></div><section id="feed" class="social-feed"><div class="panel social-loading">Cargando publicaciones…</div></section>
</main>
<div class="social-modal" id="composerModal" aria-hidden="true"><div class="social-modal-card"><header><h2>Crear publicación</h2><button class="modal-close" data-close="composerModal" type="button">×</button></header><form id="postForm"><textarea id="postBody" maxlength="3000" placeholder="¿Qué está pasando?" required></textarea><label class="social-file">📷 Imagen opcional<input id="postImage" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></label><div id="postPreview" class="social-preview"></div><button class="primary" type="submit">Publicar</button></form></div></div>
<div class="social-modal" id="storyModal" aria-hidden="true"><div class="social-modal-card story-editor"><header><h2>↻ Crear historia</h2><button class="modal-close" data-close="storyModal" type="button">×</button></header><form id="storyForm"><div id="storyCanvas" class="story-canvas">¡Texto con brillo ✨</div><label>💬 Texto<textarea id="storyText" maxlength="300" placeholder="¿Qué está pasando?" required>¡Texto con brillo ✨</textarea></label><label>🎨 Fondo<select id="storyBackground"><option value="blue-purple">Azul y morado</option><option value="pink-orange">Rosa y naranja</option><option value="cyan-green">Cian y verde</option><option value="dark">Oscuro</option></select></label><label>📷 Imagen opcional<input id="storyImage" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></label><button class="primary" type="submit">Publicar historia ✨</button></form></div></div>
<div class="story-viewer" id="storyViewer" aria-hidden="true"><button id="closeStoryViewer" type="button">×</button><div id="storyViewerContent"></div></div>
<script type="module" src="assets/social.js?v=27"></script></body></html>
