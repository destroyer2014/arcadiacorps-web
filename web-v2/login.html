<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Acceder — ArcadiaCorps</title>
<link rel="stylesheet" href="assets/styles.css?v=37"><link rel="stylesheet" href="assets/theme-v33.css?v=34"><link rel="stylesheet" href="assets/theme-v35.css?v=35"><link rel="stylesheet" href="assets/theme-v36.css?v=36"><link rel="stylesheet" href="assets/performance-v36-2.css?v=36.2"><link rel="stylesheet" href="assets/auth-v37.css?v=37">
  <link rel="stylesheet" href="assets/release-v40.css?v=40">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#3972ff">
</head>
<body class="auth-v37">
<main class="auth-shell-v37">
<div class="auth-brand-v37"><img src="assets/images/arcadia-logo-rpg.png" alt="ArcadiaCorps"><div><strong>ArcadiaCorps</strong><small>Acceso seguro</small></div></div>
<section class="card auth-card-v37">
<h1>Bienvenido</h1><p class="auth-subtitle">Accede a ArcadiaCorps o crea una cuenta nueva.</p>
<div class="auth-tabs"><button id="loginTab" class="active" type="button">Iniciar sesión</button><button id="registerTab" type="button">Crear cuenta</button></div>
<section id="loginPanel" class="auth-panel">
<form id="loginForm">
<div class="auth-field"><label for="loginEmail">Correo electrónico</label><div class="auth-input-wrap"><input id="loginEmail" type="email" autocomplete="email" required></div></div>
<div class="auth-field"><label for="loginPassword">Contraseña</label><div class="auth-input-wrap"><input id="loginPassword" type="password" autocomplete="current-password" required><button class="password-toggle" data-password-toggle="#loginPassword" type="button">Ver</button></div></div>
<button class="primary auth-submit" type="submit">Iniciar sesión</button>
</form>
<div class="auth-help-row"><a href="forgot-password.html">¿Olvidaste tu contraseña?</a></div>
</section>
<section id="registerPanel" class="auth-panel" hidden>
<form id="registerForm">
<div class="auth-field"><label for="registerEmail">Correo electrónico</label><div class="auth-input-wrap"><input id="registerEmail" type="email" autocomplete="email" required></div></div>
<div class="auth-field"><label for="registerPassword">Contraseña nueva</label><div class="auth-input-wrap"><input id="registerPassword" type="password" autocomplete="new-password" minlength="10" required><button class="password-toggle" data-password-toggle="#registerPassword" type="button">Ver</button></div><div class="password-strength"><div id="passwordStrengthBar" class="password-strength-track" data-score="0"></div><small id="passwordStrengthText">Muy débil</small></div></div>
<div class="auth-field"><label for="registerConfirmPassword">Confirmar contraseña</label><div class="auth-input-wrap"><input id="registerConfirmPassword" type="password" autocomplete="new-password" minlength="10" required><button class="password-toggle" data-password-toggle="#registerConfirmPassword" type="button">Ver</button></div></div>
<button class="primary auth-submit" type="submit">Crear cuenta</button>
</form>
</section>
<div id="captchaBox" class="turnstile-box" hidden></div><p id="captchaHelp" class="captcha-help" hidden>CAPTCHA preparado pero desactivado. Se activa al configurar la Site Key de Turnstile.</p>
<div class="auth-divider">o continúa con</div>
<div class="oauth-grid"><button class="oauth-v37" id="googleBtn" type="button">G&nbsp;&nbsp;Google</button><button class="oauth-v37" id="githubBtn" type="button">◉&nbsp;&nbsp;GitHub</button></div>
<div id="message" class="message" role="alert" aria-live="polite"></div>
<div class="auth-security-note"><span>🔒</span><span>Sesiones Supabase Auth, OAuth PKCE y permisos RLS.</span></div>
</section>
</main>
<script type="module" src="assets/auth-ui-v37.js?v=40.2"></script>
  <script defer src="assets/release-v40.js?v=40"></script>
</body></html>
