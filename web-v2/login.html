<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acceder — ArcadiaCorps</title><link rel="stylesheet" href="assets/styles.css"></head><body><main class="shell"><div class="brand"><div class="logo">A</div><div><h1>ArcadiaCorps</h1><p>Centro de control</p></div></div><section class="card"><h2>Iniciar sesión</h2><p class="sub">Accede con tu cuenta real. No se mostrarán datos de demostración.</p><form id="loginForm"><div class="field"><label for="email">Correo electrónico</label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password" minlength="6" required></div><button class="primary" type="submit">Iniciar sesión</button></form><div class="divider">o continúa con</div><button class="oauth" id="googleBtn" type="button">G&nbsp;&nbsp;Continuar con Google</button><button class="oauth" id="githubBtn" type="button">◉&nbsp;&nbsp;Continuar con GitHub</button><div class="row" style="margin-top:14px"><button class="text-btn" id="registerBtn" type="button">Crear cuenta</button><a class="text-btn btn" href="../restablecer-clave.html">Olvidé mi contraseña</a></div><div id="message" class="message" role="alert"></div></section></main><script type="module">
import { supabase, signInWithProvider, signInWithPassword, signUpWithPassword } from './assets/auth.js';
const msg=document.querySelector('#message');const show=(text,type='error')=>{msg.textContent=text;msg.className=`message show ${type}`};
const {data:{session}}=await supabase.auth.getSession();if(session) location.replace('./dashboard.html');
document.querySelector('#googleBtn').onclick=async()=>{try{await signInWithProvider('google')}catch(e){show(e.message)}};
document.querySelector('#githubBtn').onclick=async()=>{try{await signInWithProvider('github')}catch(e){show(e.message)}};
document.querySelector('#loginForm').onsubmit=async(e)=>{e.preventDefault();try{await signInWithPassword(email.value.trim(),password.value);location.replace('./dashboard.html')}catch(err){show(err.message)}};
document.querySelector('#registerBtn').onclick=async()=>{if(!email.value||!password.value)return show('Escribe correo y contraseña para crear la cuenta.');try{await signUpWithPassword(email.value.trim(),password.value);show('Cuenta creada. Revisa tu correo para confirmarla.','ok')}catch(err){show(err.message)}};
</script></body></html>
