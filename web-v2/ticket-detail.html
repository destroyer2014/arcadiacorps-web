<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ticket — ArcadiaCorps</title><link rel="stylesheet" href="assets/styles.css?v=16"></head><body><main class="dashboard app-page ticket-detail-page"><a class="text-btn" href="tickets.html">← Volver</a><div id="head" class="page-heading"></div><section id="adminControls" class="panel" hidden><h2 class="panel-title">Gestión del ticket</h2><div class="ticket-admin-controls"><select id="status"><option value="open">Abierto</option><option value="in_progress">En proceso</option><option value="waiting_user">Esperando usuario</option><option value="closed">Cerrado</option></select><select id="priority"><option value="low">Baja</option><option value="normal">Normal</option><option value="high">Alta</option><option value="urgent">Urgente</option></select><button id="saveTicket" class="primary">Guardar estado</button></div></section><section class="panel"><div id="conversation" class="conversation">Cargando…</div><form id="reply" class="reply-box"><div class="field"><label>Responder</label><textarea id="replyBody" required maxlength="5000"></textarea></div><div class="image-picker"><input id="images" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple><div id="previews" class="image-previews"></div></div><div id="msg" class="message"></div><button class="primary">Enviar respuesta</button></form></section></main><div id="lightbox" class="lightbox"><button>×</button><img></div><script type="module">
import {supabase} from './assets/auth.js';import {mountShell} from './assets/shell.js';import {getCurrentAccess} from './assets/access.js';import {esc,fmt,signedUrls,uploadTicketImages,insertTicketMessage,statusLabel,priorityLabel} from './assets/tickets.js';const access=await getCurrentAccess();if(!access)throw Error('Sin sesión');await mountShell();const id=new URLSearchParams(location.search).get('id');if(!id)location.replace('tickets.html');let ticket;const conv=document.querySelector('#conversation'),msg=document.querySelector('#msg');const isStaff=['owner','staff'].includes(String(access.role));let files=[];async function load(){const{data:t,error}=await supabase.from('tickets').select('*').eq('id',id).single();if(error)throw error;ticket=t;document.querySelector('#head').innerHTML=`<div><span class="eyebrow">${esc(t.ticket_number)}</span><h1>${esc(t.subject)}</h1><div class="ticket-badges"><span class="ticket-badge ${t.status}">${statusLabel[t.status]}</span><span class="ticket-badge ${t.priority}">${priorityLabel[t.priority]}</span></div></div>`;if(isStaff){adminControls.hidden=false;status.value=t.status;priority.value=t.priority}const{data:rows,error:er}=await supabase.from('ticket_messages').select('*,profiles:author_id(username,full_name,role,avatar_url)').eq('ticket_id',id).order('created_at');if(er)throw er;const all=await Promise.all(rows.map(async r=>({...r,urls:await signedUrls(r.attachments||[])})));conv.innerHTML=all.map(r=>{const mine=r.author_id===access.user.id;const staff=['owner','staff'].includes(String(r.profiles?.role));return `<article class="message-bubble ${mine?'mine':''} ${staff?'staff':''}"><header><strong>${esc(r.profiles?.full_name||r.profiles?.username||'Usuario')}${staff?' · Soporte':''}</strong><small>${fmt(r.created_at)}</small></header><p>${esc(r.body)}</p>${r.urls.length?`<div class="attachment-grid">${r.urls.map(x=>`<button class="attachment" data-url="${esc(x.url)}"><img src="${esc(x.url)}"></button>`).join('')}</div>`:''}</article>`}).join('');document.querySelectorAll('.attachment').forEach(b=>b.onclick=e=>{e.preventDefault();lightbox.querySelector('img').src=b.dataset.url;lightbox.classList.add('open')})}document.querySelector('#images').onchange=e=>{files=[...e.target.files];previews.innerHTML=files.map(f=>`<div class="image-preview"><img src="${URL.createObjectURL(f)}"></div>`).join('')};document.querySelector('#reply').onsubmit=async e=>{e.preventDefault();const btn=e.submitter;btn.disabled=true;try{const paths=await uploadTicketImages(files,access.user.id,id);const{error}=await insertTicketMessage({ticket,authorId:access.user.id,body:replyBody.value.trim(),attachments:paths});if(error)throw error;await supabase.from('tickets').update({status:isStaff?'waiting_user':'open',updated_at:new Date().toISOString()}).eq('id',id);replyBody.value='';files=[];previews.innerHTML='';await load()}catch(x){msg.textContent=x.message;msg.className='message show error'}btn.disabled=false};document.querySelector('#saveTicket').onclick=async()=>{const{error}=await supabase.from('tickets').update({status:status.value,priority:priority.value,updated_at:new Date().toISOString()}).eq('id',id);if(error){msg.textContent=error.message;msg.className='message show error'}else await load()};lightbox.onclick=e=>{if(e.target===lightbox||e.target.tagName==='BUTTON')lightbox.classList.remove('open')};await load();</script></body></html>
