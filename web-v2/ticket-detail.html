<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ticket — ArcadiaCorps</title><link rel="stylesheet" href="assets/styles.css?v=26">
  <link rel="stylesheet" href="assets/theme-v33.css?v=34">
  <script defer src="assets/effects-v33.js?v=34"></script>
</head><body><main class="dashboard app-page ticket-detail-page"><a class="text-btn" href="tickets.html">← Volver</a><div id="head" class="page-heading"></div><section id="adminControls" class="panel" hidden><h2 class="panel-title">Gestión del ticket</h2><div class="ticket-admin-controls"><select id="status"><option value="open">Abierto</option><option value="in_progress">En proceso</option><option value="waiting_user">Esperando usuario</option><option value="closed">Cerrado</option></select><select id="priority"><option value="low">Baja</option><option value="normal">Normal</option><option value="high">Alta</option><option value="urgent">Urgente</option></select><button id="saveTicket" class="primary">Guardar estado</button></div></section><section class="panel"><div id="conversation" class="conversation">Cargando…</div><form id="reply" class="reply-box"><div class="field"><label>Responder</label><textarea id="replyBody" required maxlength="5000"></textarea></div><div class="image-picker"><input id="images" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple><div id="previews" class="image-previews"></div></div><div id="msg" class="message"></div><button class="primary">Enviar respuesta</button></form></section></main><div id="lightbox" class="lightbox"><button>×</button><img></div><script type="module">
import {supabase} from './assets/auth.js';import {mountShell} from './assets/shell.js';import {getCurrentAccess} from './assets/access.js';import {esc,fmt,signedUrls,uploadTicketImages,insertTicketMessage,statusLabel,priorityLabel} from './assets/tickets.js';const access=await getCurrentAccess();if(!access)throw Error('Sin sesión');await mountShell();const id=new URLSearchParams(location.search).get('id');if(!id)location.replace('tickets.html');let ticket;const conv=document.querySelector('#conversation'),msg=document.querySelector('#msg'),adminControlsEl=document.querySelector('#adminControls'),statusSelect=document.querySelector('#status'),prioritySelect=document.querySelector('#priority'),replyBodyEl=document.querySelector('#replyBody'),previewsEl=document.querySelector('#previews'),lightboxEl=document.querySelector('#lightbox');const isStaff=['owner','staff'].includes(String(access.role));let files=[];async function load(){const{data:t,error}=await supabase.from('tickets').select('*').eq('id',id).single();if(error)throw error;ticket=t;document.querySelector('#head').innerHTML=`<div><span class="eyebrow">${esc(t.ticket_number)}</span><h1>${esc(t.subject)}</h1><div class="ticket-badges"><span class="ticket-badge ${esc(t.status||'')}">${esc(statusLabel[t.status]||t.status||'Sin estado')}</span><span class="ticket-badge ${esc(t.priority||'')}">${esc(priorityLabel[t.priority]||t.priority||'Normal')}</span></div></div>`;if(isStaff){adminControlsEl.hidden=false;if([...statusSelect.options].some(o=>o.value===t.status))statusSelect.value=t.status;if([...prioritySelect.options].some(o=>o.value===t.priority))prioritySelect.value=t.priority}const replyForm=document.querySelector('#reply');const replyButton=replyForm.querySelector('button.primary');const isClosed=t.status==='closed';replyBodyEl.disabled=isClosed&&!isStaff;document.querySelector('#images').disabled=isClosed&&!isStaff;replyButton.disabled=isClosed&&!isStaff;if(isClosed&&!isStaff){msg.textContent='Este ticket está cerrado. Soporte puede reabrirlo.';msg.className='message show'}const{data:rows,error:er}=await supabase.from('ticket_messages').select('*').eq('ticket_id',id).order('created_at');if(er)throw er;const authorIds=[...new Set((rows||[]).map(r=>r.author_id||r.sender_id).filter(Boolean))];let profileMap={};if(authorIds.length){const{data:profiles,error:pe}=await supabase.from('profiles').select('id,username,full_name,role,avatar_url').in('id',authorIds);if(!pe)profileMap=Object.fromEntries((profiles||[]).map(p=>[p.id,p]));}const all=await Promise.all((rows||[]).map(async r=>({...r,profile:profileMap[r.author_id||r.sender_id]||null,urls:await signedUrls(Array.isArray(r.attachments)?r.attachments:[])})));conv.innerHTML=all.length?all.map(r=>{const authorId=r.author_id||r.sender_id;const mine=authorId===access.user.id;const role=String(r.profile?.role||'').toLowerCase();const staff=['owner','staff','admin','adm'].includes(role);const roleBadge=role==='owner'?`<span class="message-role owner"><span class="role-shield">🛡</span>Owner</span>`:(['staff','admin','adm'].includes(role)?`<span class="message-role admin"><span class="role-shield">🛡</span>Adm</span>`:'');return `<article class="message-bubble ${mine?'mine':''} ${role==='owner'?'role-owner':staff?'role-staff':''}"><header><div class="message-author"><strong>${esc(r.profile?.full_name||r.profile?.username||(staff?'Soporte':'Usuario'))}</strong>${roleBadge}</div><small>${fmt(r.created_at)}</small></header><p>${esc(r.body||r.message||'')}</p>${r.urls.length?`<div class="attachment-grid">${r.urls.map(x=>`<button class="attachment" data-url="${esc(x.url)}" type="button"><img src="${esc(x.url)}" alt="Imagen adjunta" loading="lazy"></button>`).join('')}</div>`:''}</article>`}).join(''):'<p class="muted">Todavía no hay mensajes en este ticket.</p>';document.querySelectorAll('.attachment').forEach(b=>b.onclick=e=>{e.preventDefault();lightboxEl.querySelector('img').src=b.dataset.url;lightboxEl.classList.add('open')})}document.querySelector('#images').onchange=e=>{files=[...e.target.files];previewsEl.innerHTML=files.map(f=>`<div class="image-preview"><img src="${URL.createObjectURL(f)}"></div>`).join('')};document.querySelector('#reply').onsubmit=async e=>{e.preventDefault();const btn=e.submitter;btn.disabled=true;try{const paths=await uploadTicketImages(files,access.user.id,id);const{error}=await insertTicketMessage({ticket,authorId:access.user.id,body:replyBodyEl.value.trim(),attachments:paths});if(error)throw error;await supabase.from('tickets').update({status:isStaff?'waiting_user':'open',updated_at:new Date().toISOString()}).eq('id',id);replyBodyEl.value='';files=[];previewsEl.innerHTML='';document.querySelector('#images').value='';await load()}catch(x){msg.textContent=x.message;msg.className='message show error'}btn.disabled=false};document.querySelector('#saveTicket').onclick=async()=>{const{error}=await supabase.from('tickets').update({status:statusSelect.value,priority:prioritySelect.value,updated_at:new Date().toISOString()}).eq('id',id);if(error){msg.textContent=error.message;msg.className='message show error'}else await load()};lightboxEl.onclick=e=>{if(e.target===lightboxEl||e.target.tagName==='BUTTON')lightboxEl.classList.remove('open')};await load();</script></body></html>
