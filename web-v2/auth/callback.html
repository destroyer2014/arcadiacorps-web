<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Verificando acceso — ArcadiaCorps</title>
<link rel="stylesheet" href="../assets/styles.css?v=37"><link rel="stylesheet" href="../assets/theme-v33.css?v=34"><link rel="stylesheet" href="../assets/theme-v36.css?v=36"><link rel="stylesheet" href="../assets/auth-v37.css?v=37"></head>
<body class="auth-v37"><main class="auth-shell-v37"><div class="auth-brand-v37"><img src="../assets/images/arcadia-logo-rpg.png" alt="ArcadiaCorps"><div><strong>ArcadiaCorps</strong><small>Verificando acceso</small></div></div><section class="card auth-card-v37"><h1>Verificando acceso</h1><p id="state" class="auth-subtitle">Completando la sesión segura…</p></section></main>
<script type="module">
import { supabase, exchangeAuthCode, safeNextPath } from '../assets/auth.js?v=37'; import { APP_URL } from '../assets/config.js';
const state=document.querySelector('#state');
try{const params=new URLSearchParams(location.search);const oauthError=params.get('error_description')||params.get('error');if(oauthError)throw new Error(oauthError);const code=params.get('code');if(code)await exchangeAuthCode(code);const {data:{session},error}=await supabase.auth.getSession();if(error)throw error;if(!session)throw new Error('No se pudo crear la sesión.');const stored=sessionStorage.getItem('arcadia-auth-next');sessionStorage.removeItem('arcadia-auth-next');location.replace(safeNextPath(stored,`${APP_URL}/dashboard.html?v=37`))}catch(error){state.textContent='No se pudo completar el acceso. Volviendo al inicio de sesión…';state.style.color='#ff9aaa';setTimeout(()=>location.replace(`${APP_URL}/login.html`),2600)}
</script></body></html>
