<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nueva contraseña — ArcadiaCorps</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <main class="shell">
    <div class="brand"><div class="logo">A</div><div><h1>ArcadiaCorps</h1><p>Recuperación segura</p></div></div>
    <section class="card">
      <h2>Crear nueva contraseña</h2>
      <p class="sub">Abre esta página desde el enlace recibido por correo.</p>
      <form id="passwordForm">
        <div class="field"><label for="newPassword">Nueva contraseña</label><input id="newPassword" type="password" autocomplete="new-password" minlength="8" required></div>
        <div class="field"><label for="confirmPassword">Confirmar contraseña</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required></div>
        <button id="saveBtn" class="primary" type="submit">Guardar contraseña</button>
      </form>
      <div id="message" class="message" role="alert"></div>
    </section>
  </main>
  <script type="module">
    import { supabase } from './assets/auth.js';
    import { APP_URL } from './assets/config.js';

    const form = document.querySelector('#passwordForm');
    const password = document.querySelector('#newPassword');
    const confirm = document.querySelector('#confirmPassword');
    const saveBtn = document.querySelector('#saveBtn');
    const message = document.querySelector('#message');

    const show = (text, type = 'error') => {
      message.textContent = text;
      message.className = `message show ${type}`;
    };

    // Supabase procesa automáticamente los tokens del enlace mediante detectSessionInUrl.
    await new Promise(resolve => setTimeout(resolve, 300));
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) show('El enlace no es válido, expiró o ya fue utilizado. Solicita uno nuevo.');

    form.addEventListener('submit', async event => {
      event.preventDefault();
      if (password.value !== confirm.value) return show('Las contraseñas no coinciden.');
      if (password.value.length < 8) return show('Usa al menos 8 caracteres.');
      saveBtn.disabled = true;
      saveBtn.textContent = 'Guardando…';
      try {
        const { error } = await supabase.auth.updateUser({ password: password.value });
        if (error) throw error;
        await supabase.auth.signOut({ scope: 'local' });
        window.location.replace(`${APP_URL}/login.html?password=updated`);
      } catch (error) {
        show(error.message);
        saveBtn.disabled = false;
        saveBtn.textContent = 'Guardar contraseña';
      }
    });
  </script>
</body>
</html>
