<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Nueva contraseña — ArcadiaCorps</title>
  <link rel="stylesheet" href="assets/release-v40.css?v=40">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#3972ff">
<link rel="stylesheet" href="assets/styles.css?v=37"><link rel="stylesheet" href="assets/theme-v33.css?v=34"><link rel="stylesheet" href="assets/theme-v35.css?v=35"><link rel="stylesheet" href="assets/theme-v36.css?v=36"><link rel="stylesheet" href="assets/performance-v36-2.css?v=36.2"><link rel="stylesheet" href="assets/auth-v37.css?v=37"></head>
<body class="auth-v37"><main class="auth-shell-v37"><div class="auth-brand-v37"><img src="assets/images/arcadia-logo-rpg.png" alt="ArcadiaCorps"><div><strong>ArcadiaCorps</strong><small>Nueva contraseña</small></div></div>
<section class="card auth-card-v37"><h1>Crear nueva contraseña</h1><p class="auth-subtitle">El enlace de recuperación solo puede utilizarse durante su periodo de validez.</p>
<form id="passwordForm"><div class="auth-field"><label for="newPassword">Nueva contraseña</label><input id="newPassword" type="password" autocomplete="new-password" minlength="10" required></div><div class="auth-field"><label for="confirmPassword">Confirmar contraseña</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="10" required></div><button id="saveBtn" class="primary auth-submit" type="submit">Guardar contraseña</button></form><div id="message" class="message"></div><a class="auth-back" href="forgot-password.html">Solicitar otro enlace</a></section></main>
<script type="module">
import { supabase, exchangeAuthCode } from './assets/auth.js?v=37'; import { APP_URL } from './assets/config.js';
const form=document.querySelector('#passwordForm'),password=document.querySelector('#newPassword'),confirm=document.querySelector('#confirmPassword'),button=document.querySelector('#saveBtn'),message=document.querySelector('#message');
const show=(t,y='error')=>{message.textContent=t;message.className=`message show ${y}`};
try{const code=new URLSearchParams(location.search).get('code');if(code)await exchangeAuthCode(code);const {data:{session}}=await supabase.auth.getSession();if(!session){form.querySelectorAll('input,button').forEach(n=>n.disabled=true);show('El enlace no es válido, expiró o ya fue utilizado. Solicita uno nuevo.')}}catch{form.querySelectorAll('input,button').forEach(n=>n.disabled=true);show('No se pudo validar el enlace. Solicita uno nuevo.')}
form.addEventListener('submit',async e=>{e.preventDefault();if(password.value.length<10)return show('Usa al menos 10 caracteres.');if(password.value!==confirm.value)return show('Las contraseñas no coinciden.');button.disabled=true;button.textContent='Guardando…';try{const {error}=await supabase.auth.updateUser({password:password.value});if(error)throw error;await supabase.auth.signOut({scope:'local'});location.replace(`${APP_URL}/login.html?password=updated`)}catch(err){show(err.message||'No se pudo actualizar la contraseña.');button.disabled=false;button.textContent='Guardar contraseña'}});
  <script defer src="assets/release-v40.js?v=40"></script>
</script></body></html>
