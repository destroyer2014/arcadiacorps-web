<body>
<main class="dashboard app-page review-admin-page">
  <header class="page-heading">
    <div>
      <span class="eyebrow">OWNER Y STAFF</span>
      <h1>Moderar reseñas</h1>
      <p>Aprueba, rechaza o elimina opiniones de la comunidad.</p>
    </div>
  </header>

  <div id="reviewAdminNotice" class="message"></div>

  <section class="review-admin-toolbar panel">
    <div class="review-filter-tabs">
      <button class="active" data-review-filter="pending" type="button">Pendientes <span data-count="pending">0</span></button>
      <button data-review-filter="approved" type="button">Aprobadas <span data-count="approved">0</span></button>
      <button data-review-filter="rejected" type="button">Rechazadas <span data-count="rejected">0</span></button>
    </div>
    <button id="reloadReviews" class="secondary" type="button">Actualizar</button>
  </section>

  <section id="reviewAdminList" class="review-admin-list"></section>
</main>
<script type="module" src="assets/reviews-admin-v36.js?v=36"></script>
