<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel — ArcadiaCorps</title><link rel="stylesheet" href="assets/styles.css"></head><body><main class="dashboard"><div class="brand"><div class="logo">A</div><div><h1>ArcadiaCorps Web 2.0</h1><p>Autenticación real</p></div></div><section class="card"><p class="status">● Sesión activa</p><div class="user-card"><div id="avatarFallback" class="avatar">U</div><img id="avatar" class="avatar" hidden alt="Avatar"><div><h2 id="name">Usuario</h2><div id="email" class="meta"></div><div id="provider" class="meta"></div></div></div><p class="sub" style="margin-top:22px">Este panel solo muestra información real de la sesión autenticada. Los demás módulos se añadirán cuando estén conectados.</p><button id="logout" class="logout">Cerrar sesión</button></section></main><script type="module">
import { supabase, requireSession } from './assets/auth.js';import { APP_URL } from './assets/config.js';
const session=await requireSession();if(session){const u=session.user;const meta=u.user_metadata||{};name.textContent=meta.full_name||meta.user_name||meta.name||'Usuario';email.textContent=u.email||'';provider.textContent=`Proveedor: ${u.app_metadata?.provider||'email'}`;const src=meta.avatar_url;if(src){avatar.src=src;avatar.hidden=false;avatarFallback.hidden=true}else avatarFallback.textContent=(name.textContent[0]||'U').toUpperCase();}
logout.onclick=async()=>{await supabase.auth.signOut();location.replace(`${APP_URL}/login.html`)};
</script></body></html>
