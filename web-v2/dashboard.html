<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel — ArcadiaCorps</title><link rel="stylesheet" href="assets/styles.css?v=13"></head>
<body>
<main class="dashboard app-page">
  <div class="page-heading"><div><span class="eyebrow">Centro de control</span><h1 id="welcomeTitle">Bienvenido</h1><p>Tu sesión, perfil y permisos están conectados a datos reales.</p></div><span id="dashboardRole" class="role-pill">Usuario</span></div>
  <section class="dashboard-grid">
    <article class="panel account-overview">
      <div class="user-card"><div id="avatarFallback" class="avatar">U</div><img id="avatar" class="avatar" hidden alt=""><div><h2 id="userName">Usuario</h2><div id="userEmail" class="meta"></div><div id="userProvider" class="meta"></div></div></div>
      <div class="real-status"><span class="presence-dot"></span><strong>Sesión activa</strong><small>Protegida por Supabase Auth</small></div>
    </article>
    <article class="panel quick-panel"><h3 class="panel-title">Accesos</h3><a class="quick-link" href="profile.html"><span>◉</span><div><strong>Mi perfil</strong><small>Identidad, foto y seguridad</small></div><b>›</b></a><a id="adminShortcut" class="quick-link" href="admin-users.html" hidden><span>♛</span><div><strong>Usuarios y roles</strong><small>Solo Owner</small></div><b>›</b></a></article>
  </section>
</main>
<script type="module">
  import { getCurrentAccess, ROLE_LABELS } from './assets/access.js';
  import { mountShell } from './assets/shell.js';
  const access = await getCurrentAccess(); if (!access) throw new Error('No hay sesión'); await mountShell();
  const { user, profile, role } = access;
  const display = profile.full_name || profile.username || user.email?.split('@')[0] || 'Usuario';
  document.querySelector('#welcomeTitle').textContent = `Hola, ${display}`;
  document.querySelector('#userName').textContent = display;
  document.querySelector('#userEmail').textContent = user.email || 'Correo no disponible';
  document.querySelector('#userProvider').textContent = `Acceso: ${user.app_metadata?.provider || 'email'}`;
  const badge = document.querySelector('#dashboardRole'); badge.textContent = ROLE_LABELS[role] || role; badge.classList.add(`role-${role}`);
  const fallback = document.querySelector('#avatarFallback'); fallback.textContent = display[0].toUpperCase();
  const avatarUrl = profile.avatar_url || user.user_metadata?.avatar_url || user.user_metadata?.picture;
  if (avatarUrl) { const img=document.querySelector('#avatar'); img.onload=()=>{img.hidden=false;fallback.hidden=true}; img.onerror=()=>{img.hidden=true;fallback.hidden=false}; img.src=avatarUrl; }
  if (role === 'owner') document.querySelector('#adminShortcut').hidden = false;
</script></body></html>
