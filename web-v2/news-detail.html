<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Noticia — ArcadiaCorps</title><link rel="stylesheet" href="assets/styles.css?v=14">
  <link rel="stylesheet" href="assets/theme-v33.css?v=34">
  <script defer src="assets/effects-v33.js?v=36.2"></script>
  <link rel="stylesheet" href="assets/theme-v35.css?v=35">
  <link rel="stylesheet" href="assets/ai-support-v35.css?v=35">
  <script type="module" src="assets/ai-support-v35.js?v=35"></script>
  <link rel="stylesheet" href="assets/theme-v36.css?v=36">
  <link rel="stylesheet" href="assets/presence-v36.css?v=36">
  <link rel="stylesheet" href="assets/notifications-v36.css?v=36">
  <script type="module" src="assets/presence-v36.js?v=36.2"></script>
  <script type="module" src="assets/notifications-v36.js?v=36"></script>
  <link rel="stylesheet" href="assets/performance-v36-2.css?v=36.2">
</head><body>
<main class="dashboard app-page news-detail-page"><a class="text-btn back-link" href="news.html">← Volver a Noticias</a><article id="postView" class="panel news-article"><div class="empty-state">Cargando noticia…</div></article><section class="panel comments-panel"><h2 class="panel-title">💬 Comentarios <span id="commentCount">0</span></h2><form id="commentForm" class="comment-form"><textarea id="commentText" maxlength="1000" placeholder="Escribe un comentario…" required></textarea><button class="primary compact" type="submit">Publicar</button></form><div id="commentMessage" class="message"></div><div id="commentsList" class="comments-list"></div></section></main>
<script type="module">
import { mountShell } from './assets/shell.js?v=36'; import { getCurrentAccess } from './assets/access.js'; import { getNewsPost,getComments,addComment,deleteComment,escapeHtml,formatDate } from './assets/news.js';
const access=await getCurrentAccess();if(!access)throw new Error('Sin sesión');await mountShell();const slug=new URLSearchParams(location.search).get('slug')||new URLSearchParams(location.search).get('id');const post=await getNewsPost(slug||'');if(!post){document.querySelector('#postView').innerHTML='<div class="empty-state">La noticia no existe.</div>';throw new Error('Noticia no encontrada');}
const author=post.profiles?.full_name||post.profiles?.username||'ArcadiaCorps';const canEdit=['owner','staff'].includes(String(access.role));document.querySelector('#postView').innerHTML=`${post.cover_url?`<img class="article-cover" src="${escapeHtml(post.cover_url)}" alt="">`:''}<div class="article-header">${post.is_pinned?'<span class="pin-badge">📌 Fijada</span>':''}<h1>${escapeHtml(post.title)}</h1><div class="news-meta"><span>${escapeHtml(author)}</span><span>${formatDate(post.published_at||post.created_at)}</span></div></div><div class="article-content">${escapeHtml(post.content).replace(/\n/g,'<br>')}</div>${post.external_url?`<a class="btn secondary external-link" target="_blank" rel="noopener" href="${escapeHtml(post.external_url)}">Abrir enlace externo ↗</a>`:''}${canEdit?`<div class="article-actions"><a class="btn secondary" href="news-editor.html?id=${post.id}">Editar</a></div>`:''}`;
const list=document.querySelector('#commentsList'),count=document.querySelector('#commentCount'),message=document.querySelector('#commentMessage');const show=(t,e=false)=>{message.textContent=t;message.className=`message show ${e?'error':'ok'}`};
async function loadComments(){const rows=await getComments(post.id);count.textContent=rows.length;list.innerHTML=rows.length?rows.map(c=>{const n=c.profiles?.full_name||c.profiles?.username||'Usuario';const mine=c.user_id===access.user.id;const canDelete=mine||['owner','staff'].includes(String(access.role));return `<article class="comment"><div class="comment-avatar">${escapeHtml(n[0]?.toUpperCase()||'U')}</div><div><header><strong>${escapeHtml(n)}</strong><time>${formatDate(c.created_at)}</time></header><p>${escapeHtml(c.content)}</p>${canDelete?`<button class="text-btn delete-comment" data-id="${c.id}" type="button">Eliminar</button>`:''}</div></article>`}).join(''):'<div class="empty-state">Sé el primero en comentar.</div>';list.querySelectorAll('.delete-comment').forEach(b=>b.onclick=async()=>{if(!confirm('¿Eliminar este comentario?'))return;try{await deleteComment(b.dataset.id);await loadComments()}catch(e){show(e.message,true)}})}
document.querySelector('#commentForm').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;try{await addComment(post.id,document.querySelector('#commentText').value);document.querySelector('#commentText').value='';show('Comentario publicado.');await loadComments()}catch(err){show(err.message,true)}finally{b.disabled=false}};await loadComments();
</script></body></html>
