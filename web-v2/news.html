<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Noticias — ArcadiaCorps</title><link rel="stylesheet" href="assets/styles.css?v=14"></head><body>
<main class="dashboard app-page news-page">
  <div class="page-heading"><div><span class="eyebrow">Comunidad</span><h1>Noticias y anuncios</h1><p>Novedades oficiales publicadas por Owner y Staff.</p></div><a id="createNews" class="btn primary compact" href="news-editor.html" hidden>＋ Nueva publicación</a></div>
  <section id="pinnedSection" hidden><h2 class="section-heading">📌 Fijadas</h2><div id="pinnedNews" class="news-featured-grid"></div></section>
  <section><div class="news-section-head"><h2 class="section-heading">Últimas novedades</h2><button id="refreshNews" class="secondary compact" type="button">Actualizar</button></div><div id="newsMessage" class="message"></div><div id="newsList" class="news-grid"><div class="panel empty-state">Cargando noticias…</div></div></section>
</main>
<script type="module">
import { mountShell } from './assets/shell.js'; import { getCurrentAccess } from './assets/access.js'; import { listPublishedNews, escapeHtml, formatDate } from './assets/news.js';
const access=await getCurrentAccess(); if(!access) throw new Error('Sin sesión'); await mountShell();
if(['owner','staff'].includes(String(access.role))) document.querySelector('#createNews').hidden=false;
const msg=document.querySelector('#newsMessage'); const show=(t,e=false)=>{msg.textContent=t;msg.className=`message show ${e?'error':'ok'}`};
function card(post, featured=false){const author=post.profiles?.full_name||post.profiles?.username||'ArcadiaCorps';const cover=post.cover_url?`<img src="${escapeHtml(post.cover_url)}" alt="" class="news-cover">`:`<div class="news-cover placeholder">AC</div>`;return `<article class="news-card ${featured?'featured':''}">${cover}<div class="news-card-body">${post.is_pinned?'<span class="pin-badge">📌 Fijada</span>':''}<h3>${escapeHtml(post.title)}</h3><div class="news-meta"><span>${escapeHtml(author)}</span><span>${formatDate(post.published_at||post.created_at)}</span></div><p>${escapeHtml(post.excerpt||post.content.slice(0,180))}</p><a class="btn secondary" href="news-detail.html?slug=${encodeURIComponent(post.slug)}">Leer noticia</a></div></article>`}
async function load(){document.querySelector('#newsList').innerHTML='<div class="panel empty-state">Cargando noticias…</div>';try{const posts=await listPublishedNews();const pinned=posts.filter(p=>p.is_pinned);const rest=posts.filter(p=>!p.is_pinned);document.querySelector('#pinnedSection').hidden=!pinned.length;document.querySelector('#pinnedNews').innerHTML=pinned.map(p=>card(p,true)).join('');document.querySelector('#newsList').innerHTML=rest.length?rest.map(p=>card(p)).join(''):'<div class="panel empty-state">Todavía no hay noticias publicadas.</div>';}catch(e){show(e.message,true);document.querySelector('#newsList').innerHTML='';}}
document.querySelector('#refreshNews').onclick=load; await load();
</script></body></html>
