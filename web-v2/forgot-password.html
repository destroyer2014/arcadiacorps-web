<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Recuperar contraseña — ArcadiaCorps</title>
  <link rel="stylesheet" href="assets/release-v40.css?v=40">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#3972ff">
<link rel="stylesheet" href="assets/styles.css?v=37"><link rel="stylesheet" href="assets/theme-v33.css?v=34"><link rel="stylesheet" href="assets/theme-v35.css?v=35"><link rel="stylesheet" href="assets/theme-v36.css?v=36"><link rel="stylesheet" href="assets/performance-v36-2.css?v=36.2"><link rel="stylesheet" href="assets/auth-v37.css?v=37"></head>
<body class="auth-v37"><main class="auth-shell-v37"><div class="auth-brand-v37"><img src="assets/images/arcadia-logo-rpg.png" alt="ArcadiaCorps"><div><strong>ArcadiaCorps</strong><small>Recuperación segura</small></div></div>
<section class="card auth-card-v37"><h1>Recuperar contraseña</h1><p class="auth-subtitle">Escribe tu correo. Por privacidad, mostraremos la misma respuesta exista o no la cuenta.</p>
<form id="recoveryForm"><div class="auth-field"><label for="email">Correo electrónico</label><input id="email" type="email" autocomplete="email" required></div><div id="captchaBox" class="turnstile-box" hidden></div><p id="captchaHelp" class="captcha-help" hidden>CAPTCHA preparado pero desactivado.</p><button class="primary auth-submit" id="sendBtn" type="submit">Enviar enlace</button></form>
<div id="message" class="message" role="alert" aria-live="polite"></div><a class="auth-back" href="login.html">← Volver a iniciar sesión</a></section></main>
<script type="module">
import { sendPasswordRecovery } from './assets/auth.js?v=37';
import { createCaptchaController } from './assets/turnstile-v37.js?v=37';
const form=document.querySelector('#recoveryForm'),email=document.querySelector('#email'),button=document.querySelector('#sendBtn'),message=document.querySelector('#message');
const captcha=await createCaptchaController(document.querySelector('#captchaBox')); if(!captcha.configured)document.querySelector('#captchaHelp').hidden=false;
const show=(text,type='error')=>{message.textContent=text;message.className=`message show ${type}`};
form.addEventListener('submit',async e=>{e.preventDefault();const token=captcha.getToken();if(captcha.configured&&!token)return show('Completa la verificación anti-bots.');button.disabled=true;button.textContent='Enviando…';try{await sendPasswordRecovery(email.value.trim(),token);show('Si existe una cuenta asociada a ese correo, recibirás un enlace. Revisa también spam.','ok')}catch(error){if(/captcha/i.test(error.message||''))show('Completa nuevamente la verificación anti-bots.');else show('Si existe una cuenta asociada a ese correo, recibirás un enlace. Revisa también spam.','ok');}finally{captcha.reset();button.disabled=false;button.textContent='Enviar enlace'}});
  <script defer src="assets/release-v40.js?v=40"></script>
</script></body></html>
