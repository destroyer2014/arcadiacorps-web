<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Recuperar contraseña — ArcadiaCorps</title>
  <link rel="stylesheet" href="assets/styles.css?v=9">

  <link rel="stylesheet" href="assets/theme-v33.css?v=34">
  <script defer src="assets/effects-v33.js?v=34"></script>
</head>
<body>
  <main class="shell">
    <div class="brand"><div class="logo">A</div><div><h1>ArcadiaCorps</h1><p>Centro de control</p></div></div>
    <section class="card">
      <h2>Recuperar contraseña</h2>
      <p class="sub">Escribe el correo de tu cuenta y te enviaremos un enlace seguro.</p>
      <form id="recoveryForm">
        <div class="field"><label for="email">Correo electrónico</label><input id="email" type="email" autocomplete="email" required></div>
        <button class="primary" id="sendBtn" type="submit">Enviar enlace</button>
      </form>
      <a class="text-btn wide-link recovery-link" href="login.html">Volver a iniciar sesión</a>
      <div id="message" class="message" role="alert"></div>
    </section>
  </main>
  <script type="module">
    import { sendPasswordRecovery } from './assets/auth.js?v=9';
    const form = document.querySelector('#recoveryForm');
    const emailInput = document.querySelector('#email');
    const sendBtn = document.querySelector('#sendBtn');
    const message = document.querySelector('#message');
    const show = (text, type='error') => { message.textContent=text; message.className=`message show ${type}`; };
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      sendBtn.disabled = true;
      sendBtn.textContent = 'Enviando…';
      try {
        await sendPasswordRecovery(emailInput.value.trim());
        show('Enlace enviado. Revisa tu correo y la carpeta de spam.', 'ok');
      } catch (error) {
        show(error.message || 'No se pudo enviar el enlace.');
      } finally {
        sendBtn.disabled = false;
        sendBtn.textContent = 'Enviar enlace';
      }
    });
  </script>
</body>
</html>
