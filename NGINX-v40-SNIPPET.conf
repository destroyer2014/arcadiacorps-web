# ArcadiaCorps v40 — añadir dentro del bloque server {}

server_tokens off;

# Cabeceras seguras que no rompen Supabase/EvoGB.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# Página 404 de ArcadiaCorps.
error_page 404 /web-v2/404.html;

# Errores propios de Nginx.
error_page 500 502 503 504 /web-v2/50x.html;

location = /web-v2/404.html {
    internal;
}

location = /web-v2/50x.html {
    internal;
}

# HTML siempre fresco.
location ~* ^/web-v2/.*\.html$ {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
}

# Assets versionados/cacheables.
location ~* ^/web-v2/assets/.*\.(?:css|js|png|jpg|jpeg|webp|gif|svg|ico|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
}
